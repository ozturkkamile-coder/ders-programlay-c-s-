
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ders Programım</title>

    <!-- Bootstrap tasarım kütüphanesini ekler. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Kendi CSS dosyamızı bağlar. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sayfanın tamamını kapsayan ana alan. -->
    <div class="container py-5">

        <!-- Üst başlık alanı. -->
        <header class="hero mb-4">
            <div class="hero-icon">📅</div>
            <div>
                <h1>Ders Programım</h1>
                <p>Derslerini planla, geleceğine yön ver.</p>
            </div>
            <div class="hero-decoration">🎓</div>
        </header>

        <!-- Ders ekleme kartı. -->
        <section class="card custom-card mb-4">
            <div class="section-title">
                <span class="title-icon">＋</span>
                <div>
                    <h2>Yeni Ders Ekle</h2>
                    <p>Ders bilgilerini gir ve programına ekle.</p>
                </div>
            </div>

            <!-- Ders seçme alanı. -->
            <div class="mb-3">
                <label for="dersAdi" class="form-label">Ders Adı</label>
                <select id="dersAdi" class="form-select">
                    <option value="">Ders seçiniz</option>
                    <option>İleri Web Tasarımı</option>
                    <option>Sayısal Elektrik</option>
                    <option>İş Ahlakı</option>
                    <option>Mobil Programlama</option>
                    <option>Nesne Tabanlı Programlama</option>
                    <option>Yapay Zeka</option>
                </select>
            </div>

            <!-- Ders gününü seçme alanı. -->
            <div class="mb-3">
                <label for="gun" class="form-label">Gün</label>
                <select id="gun" class="form-select">
                    <option value="">Gün seçiniz</option>
                    <option>Pazartesi</option>
                    <option>Salı</option>
                    <option>Çarşamba</option>
                    <option>Perşembe</option>
                    <option>Cuma</option>
                    <option>Cumartesi</option>
                    <option>Pazar</option>
                </select>
            </div>

            <!-- Başlangıç ve bitiş saatlerini yan yana gösterir. -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="baslangic" class="form-label">Başlangıç Saati</label>
                    <input type="time" id="baslangic" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="bitis" class="form-label">Bitiş Saati</label>
                    <input type="time" id="bitis" class="form-control">
                </div>
            </div>

            <!-- Ders ekleme butonu. -->
            <button type="button" id="dersEkle" class="btn btn-add">
                + Ders Ekle
            </button>

            <!-- Başarı ve hata mesajlarını gösterir. -->
            <p id="mesaj" class="message mt-3 mb-0"></p>
        </section>

        <!-- Haftalık ders programı kartı. -->
        <section class="card custom-card">
            <div class="list-heading">
                <div class="section-title mb-0">
                    <span class="title-icon">▦</span>
                    <div>
                        <h2>Ders Listem</h2>
                        <p>Haftalık ders programın.</p>
                    </div>
                </div>

                <button type="button" id="tumunuSil" class="btn btn-delete-all">
                    Tümünü Sil
                </button>
            </div>

            <!-- Tabloyu küçük ekranlarda kaydırılabilir yapar. -->
            <div class="table-responsive mt-3">
                <table class="table timetable">
                    <thead>
                        <tr>
                            <th>Saat</th>
                            <th>Pazartesi</th>
                            <th>Salı</th>
                            <th>Çarşamba</th>
                            <th>Perşembe</th>
                            <th>Cuma</th>
                            <th>Cumartesi</th>
                            <th>Pazar</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>

                    <!-- JavaScript dersleri buraya ekler. -->
                    <tbody id="dersTablosu"></tbody>
                </table>
            </div>

            <footer class="footer-text"> Daha iyi bir sen için...</footer>
        </section>

    </div>

    <!-- JavaScript dosyamızı bağlar. -->
    <script src="app.js"></script>
</body>
</html>
